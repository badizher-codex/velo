name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  # Manual trigger. Added after the GitHub outage of 2026-08-12, during which
  # pushes stopped starting workflows and there was no way to run CI by hand —
  # the repo looked broken and nothing could prove otherwise (lesson #58: check
  # githubstatus.com before blaming the repo). A dispatch entry costs nothing
  # and turns "wait and hope" into a button.
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore VELO.sln -p:Platform=x64

      - name: Build
        run: dotnet build VELO.sln --configuration Release -p:Platform=x64 --no-restore -v quiet

      - name: Test
        run: >
          dotnet test VELO.sln
          --configuration Release
          -p:Platform=x64
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 14
